project:
  title:        "Tiny Blackjack"
  author:       "AmitChen1415"
  discord:      "amitchen_"
  description:  "A VGA Blackjack game: deal, hit, stand, double, with on-screen cards and balance display."
  language:     "Verilog"
  clock_hz:     25000000

  # 1x2 tiles para el tamaño de 160x200
  tiles: "1x2"

  top_module:  "tt_um_AmitChen1415"

  source_files:
    - "tt_um_AmitChen1415.v"
    - "blackjack_core.v"
    - "blackjack_table.v"
    - "vga_controller.v"
    - "pwrup_synchronizer.v"
    - "clk_div_25mhz.v"

pinout:
  # Inputs
  ui[0]: "HIT button"
  ui[1]: "STAND button"
  ui[2]: "DOUBLE button"
  ui[3]: "RESET (Active Low)"
  ui[4]: "START/DEAL button"
  ui[5]: "Unused"
  ui[6]: "Unused"
  ui[7]: "Unused"

  # Outputs (Standard Tiny VGA Pinout)
  uo[0]: "VGA R1"
  uo[1]: "VGA G1"
  uo[2]: "VGA B1"
  uo[3]: "VGA VSYNC"
  uo[4]: "VGA R0"
  uo[5]: "VGA G0"
  uo[6]: "VGA B0"
  uo[7]: "VGA HSYNC"

  # Bidirectional IOs (Unused in this design)
  uio[0]: "Unused"
  uio[1]: "Unused"
  uio[2]: "Unused"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

yaml_version: 6